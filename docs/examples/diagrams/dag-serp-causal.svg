<path d="M 264.1 288.0 L 264.1 306.0 Q 264.1 314.0 272.1 314.0 L 326.4 314.0 Q 334.4 314.0 334.4 322.0 L 334.4 351.0" fill="none" stroke="rgba(176, 176, 196, 0.70)" stroke-width="1.25" marker-end="url(#dag-serp-causal-arrow)" data-src="dwell" data-dst="click"/>
<path d="M 529.1 168.0 L 529.1 224.0 Q 529.1 232.0 529.1 240.0 L 529.1 280.0 Q 529.1 288.0 529.1 296.0 L 529.1 318.0 Q 529.1 326.0 521.1 326.0 L 395.8 326.0 Q 387.8 326.0 387.8 334.0 L 387.8 351.0" fill="none" stroke="rgba(176, 176, 196, 0.70)" stroke-width="1.25" marker-end="url(#dag-serp-causal-arrow)" data-src="ads" data-dst="click"/>
