<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dag-serp-causal-title dag-serp-causal-desc" viewBox="0 0 780.0 592.0" width="780.0" height="592.0" font-family="ui-sans-serif, -apple-system, system-ui, sans-serif">
<title id="dag-serp-causal-title">Causal model of SERP satisfaction</title>
<desc id="dag-serp-causal-desc">Illustrative causal model, not a fitted one. Query ambiguity and SERP layout both drive dwell time; dwell time and ad density both drive the click; the click drives post-task satisfaction. One feedback edge: low satisfaction leads to a reformulated, differently ambiguous next query.</desc>
<defs><marker id="dag-serp-causal-arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="rgba(176, 176, 196, 0.70)"/></marker><marker id="dag-serp-causal-arrow-back" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#7dd4e4"/></marker></defs>
<rect width="780.0" height="592.0" fill="#0a0a0f"/>
<text x="48" y="48" fill="#e6e4d2" font-size="20" font-weight="600" text-anchor="start">Causal model of SERP satisfaction</text>
<path d="M 129.1 168.0 L 129.1 186.0 Q 129.1 194.0 137.1 194.0 L 229.4 194.0 Q 237.4 194.0 237.4 202.0 L 237.4 231.0" fill="none" stroke="rgba(176, 176, 196, 0.70)" stroke-width="1.25" marker-end="url(#dag-serp-causal-arrow)" data-src="amb" data-dst="dwell"/>
