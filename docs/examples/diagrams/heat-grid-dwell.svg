<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="heat-grid-dwell-title heat-grid-dwell-desc" viewBox="0 0 972 672" width="972" height="672" font-family="ui-sans-serif, -apple-system, system-ui, sans-serif">
<title id="heat-grid-dwell-title">Where searchers dwell, by position and intent</title>
<desc id="heat-grid-dwell-desc">Illustrative values, not measured data. Heat grid of mean fixation dwell in milliseconds by SERP position (rows 1 to 6–10) and query intent (navigational, informational, transactional, local). Dwell falls with position in every intent column, and the informational column is highest at every position; the focal cell, position 1 informational, is 588 ms and is excluded from the scale. Position 4 local has no measurement.</desc>
<defs><pattern id="heat-grid-dwell-na-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0,0 L0,8" stroke="rgba(230, 228, 210, 0.14)" stroke-width="2"/></pattern></defs>
