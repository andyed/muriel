<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1280 420"
     preserveAspectRatio="xMidYMid meet"
     role="img"
     aria-label="muriel round-trip — design.md import to brand.toml to W3C DTCG tokens.json export">

  <!-- Background. #0a0a0f near-black, OLED-floor; 15.42:1 on #e6e4d2 cream. -->
  <rect x="0" y="0" width="1280" height="420" fill="#0a0a0f"/>

  <!-- Title strip -->
  <text x="40" y="50"
        font-family="ui-sans-serif, system-ui, sans-serif"
        font-size="22" font-weight="600" fill="#e6e4d2">
    The round-trip — brand.toml as the rigorous hub
  </text>
  <text x="40" y="78"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="12" fill="#7fdfff" opacity="0.85"
        letter-spacing="0.04em">
    DESIGN.MD &#8594;  BRAND.TOML  &#8594; W3C DESIGN TOKENS (DTCG)  &#8594; STYLE-DICTIONARY / FIGMA / iOS / ANDROID / TAILWIND
  </text>

  <!-- ─── Three columns ─── -->

  <!-- Column 1: design.md (input — community-facing) -->
  <g transform="translate(40 120)">
    <rect x="0" y="0" width="340" height="260"
          fill="#0f1117" stroke="#3a3a4a" stroke-width="1" rx="3"/>
    <text x="20" y="32"
          font-family="ui-monospace, monospace" font-size="10"
          fill="#7fdfff" letter-spacing="0.12em">SOURCE</text>
    <text x="20" y="58"
          font-family="ui-sans-serif, system-ui, sans-serif"
          font-size="18" font-weight="600" fill="#e6e4d2">DESIGN.md</text>
    <text x="20" y="80"
          font-family="ui-sans-serif, system-ui, sans-serif"
          font-size="12" fill="#b0b0c4" opacity="0.92">
      Google Stitch / awesome-design-md
    </text>

    <!-- Code excerpt -->
    <g font-family="ui-monospace, monospace" font-size="11" fill="#e6e4d2">
      <text x="20" y="118">---</text>
      <text x="20" y="134">name: Claude-design-analysis</text>
      <text x="20" y="150">colors:</text>
      <text x="32" y="166">canvas: <tspan fill="#7fdfff">"#faf9f5"</tspan></text>
      <text x="32" y="182">ink:    <tspan fill="#7fdfff">"#141413"</tspan></text>
      <text x="32" y="198">body:   <tspan fill="#7fdfff">"#3d3d3a"</tspan></text>
      <text x="32" y="214">primary:<tspan fill="#7fdfff">"#cc785c"</tspan></text>
      <text x="20" y="230">---</text>
    </g>
  </g>

  <!-- Arrow 1 -->
  <g transform="translate(380 250)">
    <line x1="0" y1="0" x2="60" y2="0"
          stroke="#ff8282" stroke-width="2"
          marker-end="url(#arrow)"/>
    <text x="30" y="-10" text-anchor="middle"
          font-family="ui-monospace, monospace" font-size="11"
          fill="#ff8282">import</text>
  </g>

  <!-- Column 2: brand.toml (muriel intermediate) -->
  <g transform="translate(450 120)">
    <rect x="0" y="0" width="340" height="260"
          fill="#0f1117" stroke="#7fdfff" stroke-width="1.5" rx="3"/>
    <text x="20" y="32"
          font-family="ui-monospace, monospace" font-size="10"
          fill="#7fdfff" letter-spacing="0.12em">HUB</text>
    <text x="20" y="58"
          font-family="ui-sans-serif, system-ui, sans-serif"
          font-size="18" font-weight="600" fill="#e6e4d2">brand.toml</text>
    <text x="20" y="80"
          font-family="ui-sans-serif, system-ui, sans-serif"
          font-size="12" fill="#b0b0c4" opacity="0.92">
      muriel v2 schema, 8:1 audited
    </text>

    <g font-family="ui-monospace, monospace" font-size="11" fill="#e6e4d2">
      <text x="20" y="118"><tspan fill="#ff8282">[colors]</tspan></text>
      <text x="20" y="134">background = <tspan fill="#7fdfff">"#faf9f5"</tspan></text>
      <text x="20" y="150">foreground = <tspan fill="#7fdfff">"#3d3d3a"</tspan></text>
      <text x="20" y="166">accent     = <tspan fill="#7fdfff">"#cc785c"</tspan></text>
      <text x="20" y="184"><tspan fill="#ff8282">[colors.aliases]</tspan></text>
      <text x="20" y="200">ink  = <tspan fill="#7fdfff">"#141413"</tspan></text>
      <text x="20" y="216">body = <tspan fill="#7fdfff">"foreground"</tspan></text>
    </g>
  </g>

  <!-- Arrow 2 -->
  <g transform="translate(790 250)">
    <line x1="0" y1="0" x2="60" y2="0"
          stroke="#ff8282" stroke-width="2"
          marker-end="url(#arrow)"/>
    <text x="30" y="-10" text-anchor="middle"
          font-family="ui-monospace, monospace" font-size="11"
          fill="#ff8282">export-dtcg</text>
  </g>

  <!-- Column 3: tokens.json (W3C DTCG output) -->
  <g transform="translate(860 120)">
    <rect x="0" y="0" width="380" height="260"
          fill="#0f1117" stroke="#3a3a4a" stroke-width="1" rx="3"/>
    <text x="20" y="32"
          font-family="ui-monospace, monospace" font-size="10"
          fill="#7fdfff" letter-spacing="0.12em">DOWNSTREAM</text>
    <text x="20" y="58"
          font-family="ui-sans-serif, system-ui, sans-serif"
          font-size="18" font-weight="600" fill="#e6e4d2">tokens.json</text>
    <text x="20" y="80"
          font-family="ui-sans-serif, system-ui, sans-serif"
          font-size="12" fill="#b0b0c4" opacity="0.92">
      W3C Design Tokens Community Group
    </text>

    <g font-family="ui-monospace, monospace" font-size="11" fill="#e6e4d2">
      <text x="20" y="118">{</text>
      <text x="32" y="134"><tspan fill="#ff8282">"color"</tspan>: {</text>
      <text x="44" y="150"><tspan fill="#ff8282">"background"</tspan>: {</text>
      <text x="56" y="166"><tspan fill="#7fdfff">"$value"</tspan>: <tspan fill="#e6e4d2">"#faf9f5"</tspan>,</text>
      <text x="56" y="182"><tspan fill="#7fdfff">"$type"</tspan>: <tspan fill="#e6e4d2">"color"</tspan></text>
      <text x="44" y="198">},</text>
      <text x="44" y="214"><tspan fill="#ff8282">"aliases"</tspan>: {</text>
      <text x="56" y="230"><tspan fill="#ff8282">"ink"</tspan>: { <tspan fill="#7fdfff">"$value"</tspan>:</text>
      <text x="68" y="246"><tspan fill="#e6e4d2">"{color.foreground}"</tspan> }</text>
    </g>
  </g>

  <!-- Arrow definition -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10"
            refX="9" refY="5" markerWidth="6" markerHeight="6"
            orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8282"/>
    </marker>
  </defs>

</svg>
