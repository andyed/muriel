<text x="776.4" y="92" fill="#e6e4d2" font-size="12" font-weight="600" text-anchor="end" data-pole="right">warmer (yellow)</text>
<line x1="288.7" y1="88" x2="652.8" y2="88" stroke="rgba(230, 228, 210, 0.45)" stroke-width="1" marker-start="url(#spectrum-palette-tritan-pole)" marker-end="url(#spectrum-palette-tritan-pole)"/>
