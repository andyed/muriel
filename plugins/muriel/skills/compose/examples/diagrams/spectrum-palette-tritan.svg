<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="spectrum-palette-tritan-title spectrum-palette-tritan-desc" viewBox="0 0 900 476" width="900" height="476" font-family="ui-sans-serif, -apple-system, system-ui, sans-serif">
<title id="spectrum-palette-tritan-title">Palette warmth under a tritan simulation</title>
<desc id="spectrum-palette-tritan-desc">Mean CIELAB b* (blue negative, yellow positive) of six muriel palettes, as designed and after muriel.cvd's tritan simulation. The three palettes farthest from neutral move furthest toward it: Wong from 17.4 to 5.3, Nord Aurora from 16.8 to 8.8, Nord Frost from -16.2 to -7.5. The three near neutral move 4 units or less. Rows sorted by signed change.</desc>
<defs><marker id="spectrum-palette-tritan-pole" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8" fill="none" stroke="rgba(230, 228, 210, 0.45)" stroke-width="1.2"/></marker><marker id="spectrum-palette-tritan-chg" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="rgba(230, 228, 210, 0.55)"/></marker><marker id="spectrum-palette-tritan-chg-focal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#7dd4e4"/></marker></defs>
<rect width="900" height="476" fill="#0a0a0f"/>
<text x="24" y="40" fill="#e6e4d2" font-size="20" font-weight="600">Palette warmth under a tritan simulation</text>
