<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="treemap-serp-title treemap-serp-desc" viewBox="0 0 960 656" width="960" height="656" font-family="ui-sans-serif, -apple-system, system-ui, sans-serif">
<title id="treemap-serp-title">Fixation time by SERP region (illustrative)</title>
<desc id="treemap-serp-desc">Illustrative treemap of mean fixation time per trial by search-results-page region, area proportional to time: organic results take about half of all fixation time (7.42 of 13.97 s), ads about a fifth (2.91 s), and the knowledge panel, related searches, navigation and pagination share the remaining quarter.</desc>
