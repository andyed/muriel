<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="funnel-q2-title funnel-q2-desc" viewBox="0 0 900 424" width="900" height="424" font-family="ui-sans-serif, -apple-system, system-ui, sans-serif">
<title id="funnel-q2-title">Acquisition funnel — Q2</title>
<desc id="funnel-q2-desc">Funnel with bar widths proportional to count: of 100,000 visitors, 24,000 signed up, 9,000 activated and 2,083 paid, about 2% end to end. Each step loses between 62% and 77% of the one before it.</desc>
<defs><marker id="py-arrow" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto" markerUnits="strokeWidth"><path d="M0,7 L4,0 L8,7" fill="none" stroke="#b0b0c4" stroke-width="1"/></marker></defs>
<rect width="900" height="424" fill="#0a0a0f"/>
<text x="450.0" y="48.0" fill="#e6e4d2" font-size="20" font-weight="600" text-anchor="middle">Acquisition funnel — Q2</text>
<polygon points="130.000,120.0 770.000,120.0 770.000,184.0 130.000,184.0" fill="rgba(230, 228, 210, 0.04)" stroke="rgba(230, 228, 210, 0.14)" stroke-width="1" data-index="0" data-value="100000"/>
<text x="450.0" y="152.0" fill="#e6e4d2" font-size="13" font-weight="600" text-anchor="middle">Visitors</text>
<text x="450.0" y="168.0" fill="#b0b0c4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" text-anchor="middle">all sessions</text>
<polygon points="373.200,184.0 526.800,184.0 526.800,248.0 373.200,248.0" fill="rgba(230, 228, 210, 0.04)" stroke="rgba(230, 228, 210, 0.14)" stroke-width="1" data-index="1" data-value="24000"/>
<text x="450.0" y="220.0" fill="#e6e4d2" font-size="13" font-weight="600" text-anchor="middle">Signups</text>
<text x="546.8" y="220.0" fill="#b0b0c4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" text-anchor="start">−76%</text>
<polygon points="421.200,248.0 478.800,248.0 478.800,312.0 421.200,312.0" fill="rgba(230, 228, 210, 0.04)" stroke="rgba(230, 228, 210, 0.14)" stroke-width="1" data-index="2" data-value="9000"/>
<text x="409.2" y="284.0" fill="#e6e4d2" font-size="13" font-weight="600" text-anchor="end">Activated</text>
<text x="498.8" y="284.0" fill="#b0b0c4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" text-anchor="start">−62%</text>
<polygon points="443.334,312.0 456.666,312.0 456.666,376.0 443.334,376.0" fill="rgba(125, 212, 228, 0.12)" stroke="#7dd4e4" stroke-width="1.5" data-index="3" data-value="2083"/>
<text x="431.3" y="348.0" fill="#e6e4d2" font-size="13" font-weight="600" text-anchor="end">Paid</text>
<text x="476.7" y="348.0" fill="#b0b0c4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" text-anchor="start">−77%</text>
<line x1="60" y1="128.0" x2="60" y2="368.0" stroke="#b0b0c4" stroke-width="1" marker-end="url(#py-arrow)"/>
<text x="44" y="248.0" fill="#b0b0c4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.5" text-anchor="middle" transform="rotate(-90 44 248.0)">DROP-OFF</text>
</svg>