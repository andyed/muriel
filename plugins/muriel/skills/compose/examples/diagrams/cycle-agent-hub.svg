<path d="M 295.0 246.1 A 204.8 204.8 0 0 1 411.5 178.8" fill="none" stroke="rgba(125, 212, 228, 0.45)" stroke-width="1.5" marker-end="url(#cycle-agent-hub-arrow)"/>
<path d="M 450.0 215.1 L 450.0 342.0" fill="none" stroke="#b0b0c4" stroke-width="1.2" stroke-dasharray="5 4" stroke-opacity="0.8" marker-end="url(#cycle-agent-hub-spoke-arrow)"/>
