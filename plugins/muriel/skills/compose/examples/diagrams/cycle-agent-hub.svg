<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cycle-agent-hub-title cycle-agent-hub-desc" viewBox="0 0 900 700" width="900" height="700" font-family="ui-sans-serif, -apple-system, system-ui, sans-serif">
<title id="cycle-agent-hub-title">Agent operating loop</title>
<desc id="cycle-agent-hub-desc">Clockwise six-step agent loop — capture, research, decide, act, measure, learn — around a shared memory. Capture, decide, measure and learn write back to the memory; research and act only read from it, so they have no write-back spoke.</desc>
