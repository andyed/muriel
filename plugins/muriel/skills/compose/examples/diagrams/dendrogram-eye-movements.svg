<title id="dendrogram-eye-movements-title">Eye-movement events</title>
<desc id="dendrogram-eye-movements-desc">Taxonomy of eye-movement events in four classes: fixation, saccade, smooth pursuit and blink, each split into its subtypes. Fixation is not stillness: it contains three movements of its own, microsaccades, drift and tremor, and the microsaccade is the event under discussion.</desc>
