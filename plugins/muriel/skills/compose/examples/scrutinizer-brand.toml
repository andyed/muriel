# Scrutinizer brand tokens — product-owned canonical file.
# See brand/README.md in scrutinizer-www for identity, assets and scope.
# Muriel carries a byte-identical manual mirror for portable rendering.

[meta]
name             = "Scrutinizer"
slug             = "scrutinizer"
version          = "0.2.0"
owner_repo       = "scrutinizer-www"
owner_path       = "scrutinizer-repo/scrutinizer-www"
canonical_source = "scrutinizer-www/brand/scrutinizer-brand.toml"
ownership_rule   = "Edit in scrutinizer-www/brand; update the Muriel example as an exact manual mirror. Asset masters stay in scrutinizer-www/src/tokens/marks."


# ─── Provenance ──────────────────────────────────────────────────────
[provenance]
source            = "scrutinizer-www/src/css/brand.css; src/tokens/index.html; previous Muriel Scrutinizer token snapshot"
sample_date       = "2026-11-03"
sample_method     = "Reconciled core colors, type families and radii with current landing CSS. Retained existing diagram/semantic palette and spacing tokens; see brand/README.md for scope."
not_auto_synced   = true
notes             = "Product-owned kit. The Muriel example is a manual mirror, not a second authority. CSS owns responsive sizes; token values do not certify all rendered states."


# ─── Colors ──────────────────────────────────────────────────────────
[colors]
background        = "#0a0a0f"   # OLED near-black, matches in-app
background_2      = "#0f1117"   # inner-panel
background_3      = "#161822"

foreground        = "#e0e0ec"   # cool ink — 15.09:1 on bg
foreground_muted  = "#b0b0c8"   #            9.30:1 on bg

# Existing orange identity accent; distinct from scientific pathway colors.
# Its brand role does not establish a physiological visibility advantage.
accent            = "#ff9933"   # 9.27:1
accent_ink        = "#ffb366"   # 11.18:1 — higher-contrast orange


# ─── Semantic states ─────────────────────────────────────────────────
[semantic.success]
text    = "#66bb6a"             # 8.35:1
surface = "#0f1a10"
border  = "#66bb6a"

[semantic.warning]
text    = "#e6a817"             # 9.38:1
surface = "#1a1408"
border  = "#e6a817"

[semantic.error]
text    = "#ff8282"             # 8.25:1
surface = "#1a0f0f"
border  = "#ff8282"

[semantic.info]
text    = "#7dd4e4"             # 11.67:1 (teal — used for in-app gaze + cursor overlays)
surface = "#0a1517"
border  = "#7dd4e4"


# ─── Data-viz palette ────────────────────────────────────────────────
# Orange anchors position 0 so legacy diagrams that pull viz.categorical[0]
# also get the brand identity colour. The remainder mirrors muriel's safe set.
[viz]
categorical = [
  "#ff9933",    # brand orange   9.27:1
  "#7dd4e4",    # gaze teal     11.67:1
  "#66bb6a",    # green          8.35:1
  "#e6a817",    # amber          9.38:1
  "#ff8282",    # coral          8.25:1
  "#c0a4ff",    # violet         9.40:1
  "#e0e0ec",    # ink cool      15.09:1
  "#d4a574",    # sand           8.87:1
]
sequential = [
  "#0a0a0f",
  "#241408",
  "#5a3010",
  "#a05a18",
  "#d49044",
  "#f0c890",
  "#e0e0ec",
]
diverging = [
  "#ff8282", "#e6a817", "#f0c890",
  "#e0e0ec",
  "#a8d8e8", "#7dd4e4", "#50b4c8",
]


# ─── Typography ──────────────────────────────────────────────────────
[typography]
display_family             = "'Space Grotesk', ui-sans-serif, system-ui, sans-serif"
display_weight             = 700
display_line_height        = 1.08
display_letter_spacing_em  = -0.02
body_family                = "ui-sans-serif, -apple-system, 'SF Pro Text', 'Segoe UI', system-ui, sans-serif"
mono_family                = "'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace"

# No fixed heading scale: brand.css uses responsive clamp() sizes.
# The former Inter/800-weight fixed scale is superseded, not a fallback.
[typography.scale]
body = { size = 17, weight = 400, line_height = 1.65 }


# ─── Structural tokens ───────────────────────────────────────────────
[spacing]
xxs  = 2
xs   = 4
sm   = 8
md   = 16
lg   = 24
xl   = 32
xxl  = 48

[radii]
sm   = 4
md   = 6
lg   = 12
pill = 9999


# ─── A11y ────────────────────────────────────────────────────────────
[a11y]
min_contrast_ratio   = 8.0
min_hit_target_px    = 44
focus_ring_color     = "accent_ink"
focus_ring_width_px  = 3


# ─── Rules ───────────────────────────────────────────────────────────
[rules]
brand_owner                              = "scrutinizer-www"
never_modify_sources                     = false
never_rebuild_image_generation_elsewhere = false
