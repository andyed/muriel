site_name: muriel
site_description: >-
  A design skill for coding agents: interaction design, visual craft,
  collection exploration, and readable artifacts grounded in design research.
site_url: https://muriel.mindbendingpixels.com/
site_author: Andy Edmonds
repo_url: https://github.com/andyed/muriel
repo_name: andyed/muriel

# Prototype wiring: sources live in site-docs/src/ (mkdocs forbids the config
# file from sitting inside docs_dir, so src is a child of site-docs/). Output is
# a scratch dir OUTSIDE the live docs/ Pages root. Symlinks under src/ are
# followed by mkdocs.
docs_dir: src
site_dir: ../site-build

# The examples/ symlink (skill tree) carries internal README.md files that are
# author notes, not site pages. Exclude them so they don't render as orphan
# pages or emit broken-link warnings for their home-path (~/.claude/…) refs.
# The example ASSETS (svg/html/toml) are still copied — channel links resolve.
exclude_docs: |
  # critique-fixtures/README.md is a stub/planning doc, not a published page.
  # NOTE: examples/gallery/README.md is intentionally NOT excluded — it is the
  # cross-channel demo gallery surfaced in the nav. Do NOT re-add a broad
  # examples/**/README.md rule or it gets swallowed (that regressed the live
  # site on 2026-05-31). Inline comments break these patterns — keep them on
  # their own lines.
  examples/critique-fixtures/README.md
  # The lab ships its own index.html; keep its source README out of that route.
  examples/linked-atlas/README.md
  # Hold the unfinished jury visual and its draft landing page.
  brand-assets/social/
  jury/

theme:
  name: material
  custom_dir: overrides        # main.html (site-docs/overrides/, sibling of this config) ports analytics + OG + favicons into <head>
  favicon: favicon-512.png   # base template's default <link rel=icon>; full light/dark set added in overrides
  palette:
    # Slate (dark) only — no light toggle. extra_css overrides to OLED.
    scheme: slate
    primary: black
    accent: cyan
  font:
    text: false      # use the system serif/sans stacks defined in muriel.css
    code: false
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.sections   # render top-level groups as bold sections
    - navigation.instant    # SPA-style instant nav
    - navigation.instant.progress
    - navigation.top        # back-to-top
    - navigation.tracking   # update URL hash to the focused anchor
    - toc.integrate         # right-rail TOC folded into the left nav
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - assets/muriel.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      use_pygments: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.details

hooks:
  - link_paths.py

plugins:
  - search

# ── Hand-built, curated navigation ─────────────────────────────────────────
# Channels lead with the high-leverage spatial/charts/infographics/science set,
# then the rest. Cross-channel references (dimensions, style-guides) live under
# Reference, not Channels. Vocabularies ordered concept-first.
nav:
  - Home: index.md
  - Examples: examples/gallery/README.md
  - Showcase: showcase/index.html
  - Channels:
      - Spatial: channels/spatial.md
      - Charts: channels/charts.md
      - Infographics: channels/infographics.md
      - Science: channels/science.md
      - Diagrams: channels/diagrams.md
      - Raster: channels/raster.md
      - SVG: channels/svg.md
      - Web: channels/web.md
      - Interactive: channels/interactive.md
      - Video: channels/video.md
      - Density viz (heatmaps): channels/heatmaps.md
      - Gaze plots: channels/gaze.md
      - Terminal: channels/terminal.md
      - Polish: channels/polish.md
      - README: channels/readme.md
      - Prose: channels/prose.md
  - Vocabularies:
      - Visible Language: vocabularies/visible-language.md
      - FUI (fictional UI): vocabularies/fui.md
      - Kinetic typography: vocabularies/kinetic-typography.md
      - KaTeX (web math): vocabularies/katex.md
      - PixiJS: vocabularies/pixijs.md
      - ECharts: vocabularies/echarts.md
      - Declassified: vocabularies/declassified.md
      - Surfaces: vocabularies/surfaces.md
      - Data-viz platforms: vocabularies/data-viz-platforms.md
      - muriel brand: vocabularies/muriel-brand.md
  - Reference:
      - Collections & Wunderkammer: references/collections.md
      - Human capabilities: references/human-capabilities.md
      - Design synthesis: references/design-synthesis.md
      - Jury protocol: references/jury.md
      - Task analysis: references/task-analysis.md
      - GOMS: references/goms.md
      - Task observation: references/task-observation.md
      - Task-analysis cases: references/task-analysis-cases.md
      - Task-analysis evaluation: references/task-analysis-evaluation.md
      - Flow patterns: references/flow-patterns.md
      - Zooming user interfaces: references/zooming-interfaces.md
      - Faceted exploration: references/faceted-exploration.md
      - Semantic zoom & linked displays: references/multiscale-coordination.md
      - Coordination adapters: references/multiscale-adapters.md
      - Coordination evaluation: references/multiscale-evaluation.md
      - Linked Atlas lab: examples/linked-atlas/index.html
      - Dimensions: channels/dimensions.md
      - Style guides (brand.toml): channels/style-guides.md
      - Brand-token schema: channels/SCHEMA.md
  - About:
      - The muriel skill: SKILL.md
      - Critique agent: agents/muriel-critique.md
      - Third-party notices: THIRD_PARTY_NOTICES.md
      - Plugin packaging spec: spec-plugin-packaging.md
