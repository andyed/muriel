<title>muriel jury</title>
<desc>Better visual work from your coding agent. muriel gives it six AI jurors for visual and interaction work. Each sees the work differently (blurred, shrunk, one glance, text only, 4× close-ups, rebuilt from stock parts), so together they catch what one reviewer misses.</desc>
