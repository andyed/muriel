<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Q3 Overview</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f3f4f6; font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; color: #111827; }
  #panel { width: 1200px; padding: 32px; background: #f3f4f6; }
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  .header h1 { font-size: 28px; font-weight: 700; margin: 0; }
  .header .sub { font-size: 13px; color: #9ca3af; margin-top: 4px; }
  .actions { display: flex; gap: 12px; }
  .btn { background: #3b82f6; color: #fff; border: 0; border-radius: 10px; padding: 10px 18px; font-size: 14px; font-weight: 600; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 16px; }
  .card { background: #fff; border-radius: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 12px rgba(0,0,0,.04); padding: 20px; }
  .kpi .label { font-size: 13px; color: #6b7280; }
  .kpi .value { font-size: 32px; font-weight: 700; margin-top: 6px; }
  .kpi .delta { display: inline-block; margin-top: 8px; font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 999px; }
  .up { background: #dcfce7; color: #16a34a; }
  .down { background: #ef4444; color: #fff; font-size: 15px !important; }
  .chart h2 { font-size: 16px; margin: 0 0 4px; }
  .chart .sub { font-size: 12px; color: #9ca3af; margin-bottom: 12px; }
  .legend { display: flex; gap: 16px; font-size: 11px; color: #6b7280; margin-top: 8px; }
  .legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; background: var(--c); }
</style>
</head>
<body>
<div id="panel">
  <div class="header">
    <div>
      <h1>Q3 Overview</h1>
      <div class="sub">Updated 2h ago</div>
    </div>
    <div class="actions">
      <button class="btn">Export CSV</button>
      <button class="btn">View full report</button>
    </div>
  </div>

  <div class="kpis">
    <div class="card kpi"><div class="label">Active users</div><div class="value">12,480</div><span class="delta up">▲ 8.2%</span></div>
    <div class="card kpi"><div class="label">Revenue</div><div class="value">$184.2k</div><span class="delta down">−12% vs Q2</span></div>
    <div class="card kpi"><div class="label">Churn</div><div class="value">3.1</div><span class="delta up">▼ 0.4</span></div>
    <div class="card kpi"><div class="label">Avg. session</div><div class="value">4.2</div><span class="delta up">▲ 0.3</span></div>
  </div>

  <div class="card chart">
    <h2>Weekly signups</h2>
    <div class="sub">Last 13 weeks</div>
    <svg width="1096" height="260" viewBox="0 0 1096 260" font-family="Inter, system-ui, sans-serif">
      <g stroke="#e5e7eb" stroke-width="1">
        <line x1="40" y1="20" x2="1096" y2="20"/>
        <line x1="40" y1="80" x2="1096" y2="80"/>
        <line x1="40" y1="140" x2="1096" y2="140"/>
        <line x1="40" y1="200" x2="1096" y2="200"/>
      </g>
      <line x1="40" y1="230" x2="1090" y2="230" stroke="#9ca3af" stroke-width="1"/>
      <g font-size="11" fill="#9ca3af" text-anchor="end">
        <text x="32" y="24">2000</text><text x="32" y="84">1500</text><text x="32" y="144">1000</text><text x="32" y="204">500</text>
      </g>
      <g fill="#3b82f6">
        <rect x="56" y="122" width="56" height="108" rx="6"/>
        <rect x="136" y="110" width="56" height="120" rx="6"/>
        <rect x="216" y="131" width="56" height="99" rx="6"/>
        <rect x="296" y="98" width="56" height="132" rx="6"/>
        <rect x="376" y="104" width="56" height="126" rx="6"/>
        <rect x="456" y="86" width="56" height="144" rx="6"/>
        <rect x="536" y="92" width="56" height="138" rx="6"/>
        <rect x="616" y="74" width="56" height="156" rx="6"/>
        <rect x="696" y="80" width="56" height="150" rx="6"/>
        <rect x="776" y="62" width="56" height="168" rx="6"/>
        <rect x="856" y="68" width="56" height="162" rx="6"/>
        <rect x="936" y="50" width="56" height="180" rx="6"/>
        <rect x="1016" y="44" width="56" height="186" rx="6"/>
      </g>
      <g font-size="11" fill="#9ca3af" text-anchor="middle">
        <text x="84" y="248">W1</text><text x="164" y="248">W2</text><text x="244" y="248">W3</text><text x="324" y="248">W4</text>
        <text x="404" y="248">W5</text><text x="484" y="248">W6</text><text x="564" y="248">W7</text><text x="644" y="248">W8</text>
        <text x="724" y="248">W9</text><text x="804" y="248">W10</text><text x="884" y="248">W11</text><text x="964" y="248">W12</text>
        <text x="1044" y="248">W13</text>
      </g>
    </svg>
    <div class="legend"><span style="--c:#3b82f6">Signups</span></div>
  </div>
</div>
</body>
</html>
